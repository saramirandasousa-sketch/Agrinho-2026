<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Café Sustentável - Agrinho 2026</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f1; color: #333; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; }
        .stats { display: flex; justify-content: space-around; margin-bottom: 20px; background: #e8f5e9; padding: 15px; border-radius: 10px; }
        .stat-box { font-size: 1.2rem; font-weight: bold; }
        #prod-val { color: #1565c0; }
        #env-val { color: #2e7d32; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        button { padding: 15px; font-size: 1rem; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; background: #388e3c; color: white; }
        button:hover { background: #2e7d32; transform: translateY(-2px); }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message { margin-top: 20px; font-style: italic; color: #555; min-height: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>☕ Simulador Café Sustentável</h1>
    <p>Tema: Agro Forte, Futuro Sustentável</p>

    <div class="stats">
        <div class="stat-box">Produção: <span id="prod-val">50</span>%</div>
        <div class="stat-box">Meio Ambiente: <span id="env-val">50</span>%</div>
    </div>

    <div class="message" id="msg">Faça sua primeira escolha para começar a safra!</div>

    <div class="options">
        <button onclick="update(10, -15, 'Usou fertilizante químico pesado: Produção subiu, mas o solo sofreu.')">Adubo Químico</button>
        <button onclick="update(5, 10, 'Usou adubo orgânico: Crescimento constante e solo saudável!')">Adubo Orgânico</button>
        <button onclick="update(-5, 20, 'Plantou árvores nativas: Ganhou biodiversidade e sombra para o café.')">Reflorestar Área</button>
        <button onclick="update(15, -20, 'Pesticidas fortes aplicados: Pragas eliminadas, mas polinizadores sumiram.')">Pesticida Comum</button>
    </div>

    <button onclick="reset()" style="margin-top: 30px; background: #795548;">Reiniciar Simulação</button>
</div>

<script>
    let producao = 50;
    let ambiente = 50;

    function update(p, a, txt) {
        // Atualiza os valores garantindo que fiquem entre 0 e 100
        producao = Math.min(Math.max(producao + p, 0), 100);
        ambiente = Math.min(Math.max(ambiente + a, 0), 100);

        // Atualiza a tela
        document.getElementById('prod-val').innerText = producao;
        document.getElementById('env-val').innerText = ambiente;
        document.getElementById('msg').innerText = txt;

        checkStatus();
    }

    function checkStatus() {
        if (producao >= 80 && ambiente >= 80) {

        } else if (ambiente < 20
